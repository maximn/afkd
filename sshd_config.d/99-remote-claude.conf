# Copied to /etc/ssh/sshd_config.d/ by the Dockerfile. Debian's stock
# sshd_config opens with `Include /etc/ssh/sshd_config.d/*.conf` and sshd keeps
# the first value it sees for a keyword, so everything here wins over the
# defaults further down that file.
#
# This replaces a `sed` that rewrote the commented-out `#PasswordAuthentication
# yes` line in place. That worked only for as long as Debian shipped that exact
# string: reflow the comment and the sed matches nothing, exits 0, and the box
# boots with password authentication on. Silently -- which is the failure mode
# that matters on a host whose whole job is holding credentials. The Dockerfile
# asserts against `sshd -T` that this file is actually in effect.

# No passwords, ever. SSH_PUBLIC_KEYS is the only way in, and the entrypoint
# refuses to boot without it.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# This is a single-user root box by design -- the agents, the volumes and the
# whole home directory are root's. Root logs in, but by key only.
PermitRootLogin prohibit-password

# Nothing here has a display: the JetBrains backend rasterizes server-side,
# which is why the image carries libX11 without ever forwarding anything.
X11Forwarding no

# Not about brute force -- there are no passwords to guess. It caps what a
# single unauthenticated connection can cost, and each key an agent offers
# spends one try. Four leaves room for a couple of unrelated keys ahead of the
# right one; if your agent carries more, use IdentitiesOnly in ~/.ssh/config
# (ssh.md sets it) rather than raising this.
MaxAuthTries 4

# Drop connections whose peer has gone away -- a closed laptop, a phone off
# wifi. Nothing is lost: the work is in tmux, which is what `t` and `cc` are
# for. Without this those sessions pile up until sshd's MaxStartups or the
# nofile limit ends them less politely.
ClientAliveInterval 300
ClientAliveCountMax 2

# Keys come from one root-owned file per user, rewritten from SSH_PUBLIC_KEYS
# by the entrypoint on every boot -- never from ~/.ssh/authorized_keys. Home
# is persisted, so a key that once landed there would otherwise keep working
# long after it was dropped from the deployment.
AuthorizedKeysFile /etc/ssh/authorized_keys/%u

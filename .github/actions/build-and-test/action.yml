name: Build and test the image
description: >-
  Builds the image from the Dockerfile's own pinned ARG defaults and runs the
  container suite against it. Shared by CI and the weekly rebuild so the build
  and the suite cannot drift apart between them.

inputs:
  image:
    description: Tag to build and test.
    required: true
  no-cache:
    description: >-
      Build with no cache at all, to prove every pinned fetch still resolves
      rather than replaying a layer that was cached when it did.
    required: false
    default: 'false'
  cache-from:
    description: >-
      Build cache to read. Passed explicitly rather than derived from no-cache:
      in a GitHub expression `cond && '' || 'x'` never yields the empty string,
      because '' is falsy and the || falls through to 'x'.
    required: false
    default: type=gha
  cache-to:
    description: Build cache to write. Empty for a cache-less rebuild.
    required: false
    default: type=gha,mode=max
  bats-version:
    description: Pinned, so the harness cannot change underneath the suite.
    required: false
    default: 1.13.0

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    # Built with the Dockerfile's own ARG defaults, so this tests exactly the
    # pinned versions a deploy would get. No `platforms:` -- the build takes
    # the runner's own architecture, which is what makes the caller's matrix a
    # native build per architecture instead of one runner emulating the other.
    - name: Build image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        load: true
        tags: ${{ inputs.image }}
        no-cache: ${{ inputs.no-cache }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}

    # Which architecture produced this run -- without it a failing log from one
    # matrix leg is indistinguishable from the other's. Asserted rather than
    # printed, because the build is native only for as long as nobody adds a
    # `platforms:` above: the day someone does, the suite would go on passing
    # while testing the same architecture twice.
    #
    # The input reaches the shell through env, here and in the bats install
    # below, rather than as `${{ }}` spliced into the script. An expansion is
    # pasted in before bash ever parses the line, so an input carrying a quote
    # or a `$(...)` is read as code -- the same defect the entrypoint's ntfy
    # hook had. A composite action cannot see its own call sites, so it does
    # not get to assume its inputs are trusted.
    - name: Image is built for the runner's own architecture
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        built="$(docker image inspect --format '{{.Architecture}}' "$IMAGE")"
        runner="$(dpkg --print-architecture)"
        echo "image: $built | runner: $runner"
        [ "$built" = "$runner" ]

    - name: Install bats
      shell: bash
      env:
        BATS_VERSION: ${{ inputs.bats-version }}
      run: sudo npm install -g "bats@${BATS_VERSION}"

    - name: Run test suite
      shell: bash
      run: bats --print-output-on-failure --timing tests/

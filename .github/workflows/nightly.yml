name: Weekly rebuild

# The apt layer is deliberately unpinned (Debian drops old versions from the
# archive), and the pinned releases below it can be pulled or re-tagged. A
# scheduled cache-less rebuild finds that on a Monday instead of mid-deploy.
# It also re-scans the current image against a fresh vulnerability database.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild from scratch & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: remote-claude-code:nightly
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          no-cache: true
          tags: ${{ env.IMAGE }}

      - name: Install bats
        run: npm install -g bats@1.14.0

      - name: Run test suite
        run: bats --print-output-on-failure --timing tests/

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

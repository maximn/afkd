name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Not cancel-in-progress: a cancelled run can leave a release tagged with no
# GitHub release attached, or an `autorelease: pending` label on a PR nothing
# is coming back for. Two queued runs are cheap; a half-finished release is not.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR & tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing here uses GITHUB_TOKEN: release-please runs on the App token
    # minted below, so the job's own token is granted nothing at all.
    permissions: {}
    steps:
      # release-please runs as a GitHub App rather than as GITHUB_TOKEN, for
      # two reasons. The repo keeps "Allow GitHub Actions to create and approve
      # pull requests" off: that switch would hand every workflow here the
      # power to approve PRs, a review bypass OpenSSF Scorecard marks down, and
      # without it GITHUB_TOKEN cannot open the release PR at all (finding 26,
      # run 38137890319). And events caused by GITHUB_TOKEN start no workflows,
      # so a release PR it opened would get no CI and no title check, and the
      # tag it pushed would trigger nothing.
      #
      # The token is narrowed to this repository and the two permissions
      # release-please uses -- labels go through `pull-requests`, which is
      # enough for `autorelease: pending` -- and is revoked when the job ends.
      # The App is installed on this repository only. Client ID is a variable,
      # not a secret: it is public and identifies the App, it grants nothing.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # No checkout: the action talks to the API and never reads the worktree,
      # so there is no clone to leave a token in. release-please's own config
      # (release-please-config.json, .release-please-manifest.json) is read
      # from the default branch, not from disk -- which is also why a change
      # to either only takes effect once it is merged.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
        # Pinned with the exact version in the comment, as hadolint-action and
        # trivy-action already are: a comment naming a floating major goes
        # stale the moment that major moves, and zizmor's ref-version-mismatch
        # then fails `lint` until Renovate catches up -- the multi-day red
        # window #35 had to be forced off its schedule to clear.

      # The tag this created, if any. The tag and release are pushed with the
      # App token, so unlike a GITHUB_TOKEN push they do start other workflows:
      # 3c can publish from `on: release` as well as by chaining off
      # `release_created` here.
      - name: What happened
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        run: |
          echo "release created: ${RELEASE_CREATED:-false} ${TAG_NAME:-}"
          echo "release PR open: ${PRS_CREATED:-false}"

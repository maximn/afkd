name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The GHCR package's description, set as both a label and an index
  # annotation by the publish jobs below.
  IMAGE_DESCRIPTION: 'A persistent remote dev box: SSH in, start your agents, go AFK.'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits to scope its scan to the diff,
      # and reports findings as PR review comments -- GITLEAKS_ENABLE_COMMENTS
      # defaults to true and pulls.createReviewComment needs write. With read
      # it 403s on the one run that matters: the one that found a secret.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks walks the PR's commits; a depth-1 clone gives it no range.
          fetch-depth: 0
          # checkout otherwise leaves the job's token in .git/config, where
          # every later step -- and anything those steps run -- can read it and
          # push with it. Nothing in this workflow writes to the repo, so the
          # credential has no reason to outlive the clone.
          persist-credentials: false

      # Cheapest check in the repo and the one guarding the automerge gate --
      # run it before anything that needs a container pulled.
      - name: pinning guard is honest
        run: node scripts/check-pins.test.mjs

      - name: every dependency is pinned and visible to Renovate
        run: node scripts/check-pins.mjs

      # The title check itself runs in pr-title.yml, which is triggered by a
      # title edit as well as by a push. Its test runs here so a push straight
      # to main is covered too, and so both guards are proven in one place.
      - name: title guard is honest
        run: node scripts/check-pr-title.test.mjs

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      # Holds the workflows to the rule check-pins holds the Dockerfile to.
      # Renovate keeps the pins current, but only after the fact -- it pins
      # what is already on main, on its next run -- so this is what stops an
      # unpinned `uses:` merging in the first place. The default unpinned-uses
      # policy is already blanket hash-pin; .github/zizmor.yml holds the one
      # exception and why.
      #
      # Run from its image rather than zizmor-action, as actionlint is above.
      # The action defaults to `version: latest`, which would leave the tool
      # that enforces pinning floating, and to uploading SARIF, which needs
      # Advanced Security while this repo is private. A docker:// ref is one
      # Renovate already tracks.
      #
      # The token is for the online audits. impostor-commit is the one that
      # matters here: it checks each pinned SHA really is upstream's. A commit
      # from anywhere in a fork's network resolves under the upstream name just
      # as happily, and a hash pin is worth only what that check proves.
      - name: zizmor
        uses: docker://ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: .

      # shellcheck ships with the runner image. bin/* and git-aliases.zsh are
      # zsh, which shellcheck cannot parse -- they get `zsh -n` below instead,
      # along with the shell environment under zsh/.
      # Both are globbed rather than listed: a hardcoded list silently stops
      # covering the next script someone adds, and this one had already missed
      # tests/helpers.bash.
      - name: shellcheck
        run: shellcheck ./*.sh tests/*.bash

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: zsh syntax check
        run: |
          for f in bin/* zsh/* git-aliases.zsh; do
            echo "checking $f"
            zsh -n "$f"
          done

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          # Passed as HADOLINT_FAILURE_THRESHOLD, which wins over the config
          # file -- leaving it unset silently reinstates the action's `info`
          # default and fails the build on style hints.
          failure-threshold: warning

      # Free for personal repos; organisations need GITLEAKS_LICENSE.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Whether this PR touches anything the image build or its suite reads. A
  # docs-only PR used to spend eight runner-minutes rebuilding an image it
  # could not have changed, and while this repo is private those minutes come
  # out of a monthly allowance.
  #
  # On main the same answer gates the publish and the deploy. A deploy
  # recreates the container, ending every tmux session and agent on the box,
  # and a docs merge used to do that for an image with nothing new in it.
  #
  # Not `paths-ignore` on the trigger: that skips the whole workflow, and the
  # `Build & test image` check below would then never report at all. Here the
  # build is skipped and the check still reports, as a pass.
  #
  # The list names what is safe to skip rather than what to build, so a file
  # added to the image later builds by default instead of slipping past.
  # ci.yml and the composite action stay off it on purpose: they are how the
  # image gets built.
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # To find main's last green run, the push diff's base.
      actions: read
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      # Through the API rather than a checkout and a git diff: the file list is
      # all this needs, and a clone deep enough to reach the merge base costs
      # more than the answer is worth.
      #
      # A push diffs against main's last green run, not against the commit
      # before it. Runs on main cancel each other, so the commit before may
      # never have been published -- an image change it carried would ride
      # past behind a docs commit. A green run means everything up to its
      # commit is what the box runs, either built there or unchanged since an
      # earlier green run, so changes from cancelled and failed runs roll
      # forward into the next diff. Anything that leaves the base unclear
      # builds: no green run yet, a history rewritten since, or a diff past
      # the compare API's 300-file cap. A manual run always builds, which is
      # how to force a redeploy.
      - name: Diff against what is deployed
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          build() {
            echo "build: $1"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Fetched before the loop rather than fed to it by process
          # substitution, whose exit status nothing checks: a failed API call
          # would read as an empty file list and skip the build.
          case "$EVENT" in
            pull_request)
              files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[].filename')" ;;
            push)
              base="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=20" \
                --jq '[.workflow_runs[] | select(.event != "pull_request")][0].head_sha // ""')"
              [ -n "$base" ] || build "no green run on main to diff against"
              compare="$(gh api "repos/$GH_REPO/compare/$base...$SHA" \
                --jq '{status, count: (.files | length), files: [.files[].filename]}')"
              [ "$(jq -r .status <<< "$compare")" = ahead ] || build "$SHA is not ahead of $base"
              [ "$(jq .count <<< "$compare")" -lt 300 ] || build "too many files to list since $base"
              echo "diffing against $base"
              files="$(jq -r '.files[]' <<< "$compare")" ;;
            *)
              build "$EVENT run" ;;
          esac
          image=false
          while IFS= read -r f; do
            case "$f" in
              *.md | LICENSE | renovate.json | scripts/* | .gitignore | .hadolint.yaml | \
                .github/CODEOWNERS | .github/zizmor.yml | \
                .github/workflows/pr-title.yml | .github/workflows/weekly.yml)
                echo "skip:  $f" ;;
              *)
                echo "build: $f"
                image=true ;;
            esac
          done <<< "$files"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # One job per architecture, each building natively on a runner of that
  # architecture rather than one job emulating the other through QEMU -- an
  # emulated arm64 build of this image runs long enough to be the slowest
  # thing in CI, and the suite it feeds boots a real container for every case.
  #
  # A PR builds amd64 alone; arm64 waits for main. arm64 runners are 2 vCPU and
  # billed against the Actions allowance while this repo is private, and an
  # arm64-only break is rare enough to fix forward: main's arm64 leg still
  # gates the publish, so a broken arm64 build never deploys -- it holds the
  # deploy back until it is fixed. Once the repo is public they become free
  # 4-vCPU runners, and PRs can have both back.
  build-and-test-matrix:
    name: Build & test image (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      # The point of two architectures is finding out which one broke. With
      # fail-fast the second is cancelled mid-build and the log says nothing
      # about whether it would have passed.
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}
    env:
      IMAGE: afkd:ci-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Shared with the weekly rebuild, which runs the same build and the same
      # suite with the cache turned off. Kept as a composite action rather than
      # a reusable workflow so the aggregate job's name below -- the `Build &
      # test image` check Renovate's automerge is gated on -- stays put.
      - uses: ./.github/actions/build-and-test
        with:
          image: ${{ env.IMAGE }}
          # Scoped per architecture. A single scope is one cache shared by two
          # builds whose every layer differs, so each run evicts the other's
          # entries and neither ever gets a hit.
          cache-from: type=gha,scope=${{ matrix.arch }}
          # Only a push to main writes. A pull_request run's export lands on
          # refs/pull/N/merge -- a scope nothing but that PR can read, dead the
          # moment it merges. Eight merged PRs' worth of those had grown to 8GB
          # of the 10GB repo cap, and at the cap GitHub evicts entries while
          # buildx is still exporting: the blob it just wrote comes back
          # `not_found` and the build fails after the image was already built.
          # PRs still read main's cache, so nothing is lost but a write nothing
          # could have read.
          #
          # ignore-error because this is an optimisation riding on the step
          # that gates the suite: without it a cache hiccup skips every test
          # behind a red check that reads like a test failure.
          #
          # `cond && 'x' || ''` is the safe direction of the expression trap
          # documented on the action's cache-from input -- it is the inverse,
          # `cond && '' || 'x'`, that can never yield the empty string.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.arch) || '' }}

      # Main only. A scan is most of a runner-minute per leg, and what it
      # answers -- is there a fixable CRITICAL in what we would ship -- is
      # asked where shipping happens: this leg gates the publish, so a
      # CRITICAL still never deploys. The weekly rebuild scans as well.
      - name: Scan image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          # CRITICAL blocks; HIGH is reported by the weekly rebuild instead.
          # Every HIGH in this image today is upstream and unfixable here, and
          # a permanently-red gate is one nobody reads -- it holds back every
          # deploy behind it.
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # The gate Renovate's automerge waits on. Matrixing the job above renamed
  # its checks to `Build & test image (amd64)` and `(arm64)`, and a required
  # check that no longer exists is one that never reports -- so the name lives
  # here now, on a job that passes only if every architecture did.
  #
  # `always()` because a skipped or cancelled matrix leg leaves `needs` in a
  # state the default `success()` would quietly let through as not-a-failure.
  #
  # Skipped is a pass in exactly one case: the change detection ran and found
  # nothing the image reads. A skip for any other reason -- the detection
  # itself failing among them -- is a failure.
  build-and-test:
    name: Build & test image
    needs: [changes, build-and-test-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every architecture built and passed
        env:
          CHANGES: ${{ needs.changes.result }}
          IMAGE_CHANGED: ${{ needs.changes.outputs.image }}
          RESULT: ${{ needs.build-and-test-matrix.result }}
        run: |
          echo "change detection: $CHANGES | image changed: $IMAGE_CHANGED | matrix result: $RESULT"
          [ "$CHANGES" = success ]
          if [ "$IMAGE_CHANGED" = false ]; then
            echo "nothing the image reads changed -- build skipped"
            exit 0
          fi
          [ "$RESULT" = success ]

  # What a deployment pulls. Only a push to main publishes, and only once both
  # architectures have passed: the box used to build its own image on every
  # deploy -- minutes of downtime, gigabytes of build cache on its disk, and an
  # image nobody had tested.
  #
  # Rebuilt here rather than pushed from the test job, so that job never holds
  # a token that can write packages while it runs a PR's code. The build reads
  # the cache the test job just wrote for this commit, so it replays the tested
  # layers rather than re-deriving them.
  #
  # Nothing to publish when the image did not change, and so nothing to deploy:
  # the jobs behind this one skip with it, and the box keeps running.
  publish:
    name: Publish image (${{ matrix.arch }})
    needs: [changes, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.image == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag per architecture, joined into the multi-arch tags below. The
      # source label is what ties the package to this repository on GHCR, so
      # the repo's own token can keep writing to it.
      #
      # The provenance and SBOM attestations ride along as extra manifests in
      # each architecture's index, and `imagetools create` carries them into
      # the multi-arch one. GHCR lists them as `unknown/unknown` platforms;
      # nothing pulls them. max-mode provenance records the build args, which
      # here are tool versions and nothing secret.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=afkd
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  publish-tags:
    name: Publish image tags
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
      # cosign's keyless signing trades this job's OIDC token for a short-lived
      # Sigstore certificate naming this workflow, this repo and this commit.
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sha tag is what a rollback names; `main` is what a deployment
      # pulls by default.
      #
      # The labels above live in each architecture's image config. GHCR reads a
      # multi-arch package's description and licence from the index instead,
      # so they are repeated here as index annotations.
      - name: Tag the commit and main
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=$IMAGE_DESCRIPTION" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            -t "$IMAGE:$SHA" -t "$IMAGE:main" \
            "$IMAGE:$SHA-amd64" "$IMAGE:$SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:main"

      # Signs the multi-arch digest, so the signature covers both architectures
      # and their attestations, whichever tag names it. Signing a tag would
      # sign whatever the tag pointed at when cosign resolved it.
      #
      # Keyless signing writes an entry to Sigstore's public transparency log,
      # and the entry names this repository and commit.
      - name: Sign
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"

  # Coolify only learns about a new image when asked. Left to deploy on its
  # own push webhook it would deploy before this run had published anything,
  # and pull the image it already had. Skipped where COOLIFY_URL is not set, so
  # a fork without a Coolify still publishes.
  #
  # The token is the production environment's, not the repository's, and needs
  # only Coolify's `deploy` permission.
  deploy:
    name: Deploy
    needs: publish-tags
    if: vars.COOLIFY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions: {}
    steps:
      - name: Ask Coolify to deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        # POST: Coolify answers a GET here with a 400 that only says the
        # endpoint has moved to POST, and deploys nothing.
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --data-urlencode "uuid=$COOLIFY_APP_UUID" \
            "$COOLIFY_URL/api/v1/deploy"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits to scope its scan to the diff,
      # and reports findings as PR review comments -- GITLEAKS_ENABLE_COMMENTS
      # defaults to true and pulls.createReviewComment needs write. With read
      # it 403s on the one run that matters: the one that found a secret.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks walks the PR's commits; a depth-1 clone gives it no range.
          fetch-depth: 0
          # checkout otherwise leaves the job's token in .git/config, where
          # every later step -- and anything those steps run -- can read it and
          # push with it. Nothing in this workflow writes to the repo, so the
          # credential has no reason to outlive the clone.
          persist-credentials: false

      # Cheapest check in the repo and the one guarding the automerge gate --
      # run it before anything that needs a container pulled.
      - name: pinning guard is honest
        run: node scripts/check-pins.test.mjs

      - name: every dependency is pinned and visible to Renovate
        run: node scripts/check-pins.mjs

      # The title check itself runs in pr-title.yml, which is triggered by a
      # title edit as well as by a push. Its test runs here so a push straight
      # to main is covered too, and so both guards are proven in one place.
      - name: title guard is honest
        run: node scripts/check-pr-title.test.mjs

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      # Holds the workflows to the rule check-pins holds the Dockerfile to.
      # Renovate keeps the pins current, but only after the fact -- it pins
      # what is already on main, on its next run -- so this is what stops an
      # unpinned `uses:` merging in the first place. The default unpinned-uses
      # policy is already blanket hash-pin; .github/zizmor.yml holds the one
      # exception and why.
      #
      # Run from its image rather than zizmor-action, as actionlint is above.
      # The action defaults to `version: latest`, which would leave the tool
      # that enforces pinning floating, and to uploading SARIF, which needs
      # Advanced Security while this repo is private. A docker:// ref is one
      # Renovate already tracks.
      #
      # The token is for the online audits. impostor-commit is the one that
      # matters here: it checks each pinned SHA really is upstream's. A commit
      # from anywhere in a fork's network resolves under the upstream name just
      # as happily, and a hash pin is worth only what that check proves.
      - name: zizmor
        uses: docker://ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: .

      # shellcheck ships with the runner image. bin/* and git-aliases.zsh are
      # zsh, which shellcheck cannot parse -- they get `zsh -n` below instead,
      # along with the shell environment under zsh/.
      # Both are globbed rather than listed: a hardcoded list silently stops
      # covering the next script someone adds, and this one had already missed
      # tests/helpers.bash.
      - name: shellcheck
        run: shellcheck ./*.sh tests/*.bash

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: zsh syntax check
        run: |
          for f in bin/* zsh/* git-aliases.zsh; do
            echo "checking $f"
            zsh -n "$f"
          done

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          # Passed as HADOLINT_FAILURE_THRESHOLD, which wins over the config
          # file -- leaving it unset silently reinstates the action's `info`
          # default and fails the build on style hints.
          failure-threshold: warning

      # Free for personal repos; organisations need GITLEAKS_LICENSE.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job per architecture, each building natively on a runner of that
  # architecture rather than one job emulating the other through QEMU -- an
  # emulated arm64 build of this image runs long enough to be the slowest
  # thing in CI, and the suite it feeds boots a real container for every case.
  #
  # arm64 runners are 2 vCPU and billed against the Actions allowance while
  # this repo is private; they become free 4-vCPU runners when it goes public.
  build-and-test-matrix:
    name: Build & test image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # The point of two architectures is finding out which one broke. With
      # fail-fast the second is cancelled mid-build and the log says nothing
      # about whether it would have passed.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: remote-claude-code:ci-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Shared with the weekly rebuild, which runs the same build and the same
      # suite with the cache turned off. Kept as a composite action rather than
      # a reusable workflow so the aggregate job's name below -- the `Build &
      # test image` check Renovate's automerge is gated on -- stays put.
      - uses: ./.github/actions/build-and-test
        with:
          image: ${{ env.IMAGE }}
          # Scoped per architecture. A single scope is one cache shared by two
          # builds whose every layer differs, so each run evicts the other's
          # entries and neither ever gets a hit.
          cache-from: type=gha,scope=${{ matrix.arch }}
          # Only a push to main writes. A pull_request run's export lands on
          # refs/pull/N/merge -- a scope nothing but that PR can read, dead the
          # moment it merges. Eight merged PRs' worth of those had grown to 8GB
          # of the 10GB repo cap, and at the cap GitHub evicts entries while
          # buildx is still exporting: the blob it just wrote comes back
          # `not_found` and the build fails after the image was already built.
          # PRs still read main's cache, so nothing is lost but a write nothing
          # could have read.
          #
          # ignore-error because this is an optimisation riding on the step
          # that gates the suite: without it a cache hiccup skips every test
          # behind a red check that reads like a test failure.
          #
          # `cond && 'x' || ''` is the safe direction of the expression trap
          # documented on the action's cache-from input -- it is the inverse,
          # `cond && '' || 'x'`, that can never yield the empty string.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.arch) || '' }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          # CRITICAL blocks; HIGH is reported by the weekly rebuild instead.
          # Every HIGH in this image today is upstream and unfixable here, and
          # a permanently-red gate is one nobody reads -- Renovate's automerge
          # is gated on this job.
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # The gate Renovate's automerge waits on. Matrixing the job above renamed
  # its checks to `Build & test image (amd64)` and `(arm64)`, and a required
  # check that no longer exists is one that never reports -- so the name lives
  # here now, on a job that passes only if every architecture did.
  #
  # `always()` because a skipped or cancelled matrix leg leaves `needs` in a
  # state the default `success()` would quietly let through as not-a-failure.
  build-and-test:
    name: Build & test image
    needs: build-and-test-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every architecture built and passed
        env:
          RESULT: ${{ needs.build-and-test-matrix.result }}
        run: |
          echo "matrix result: $RESULT"
          [ "$RESULT" = success ]

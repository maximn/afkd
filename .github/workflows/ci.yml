name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      # shellcheck ships with the runner image. entrypoint.sh is the only bash
      # script here; bin/* and git-aliases.zsh are zsh, which shellcheck cannot
      # parse -- they get `zsh -n` below instead.
      - name: shellcheck
        run: shellcheck entrypoint.sh

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: zsh syntax check
        run: |
          for f in bin/t bin/h bin/cc bin/ch git-aliases.zsh; do
            echo "checking $f"
            zsh -n "$f"
          done

      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      # Free for personal repos; organisations need GITLEAKS_LICENSE.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & test image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: remote-claude-code:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built with the Dockerfile's own ARG defaults, so CI tests exactly the
      # pinned versions a deploy would get. linux/amd64 only: see README.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install bats
        run: npm install -g bats@1.14.0

      - name: Run test suite
        run: bats --print-output-on-failure --timing tests/

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

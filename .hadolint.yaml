# DL3008: "pin versions in apt-get install".
# Deliberately ignored -- Debian removes superseded versions from the archive,
# so a pinned apt version breaks the build the day it rolls. The versions that
# matter (fzf, starship, git-spice, herdr, the npm CLIs) are pinned as ARGs and
# bumped by Renovate. The same reasoning is written into the Dockerfile.
ignored:
  - DL3008
failure-threshold: warning

# Findings the scan reports as fixable but nothing in this repo can fix: the
# fix exists upstream of a binary or package we only download, and no release
# of that download carries it yet. Each entry is scoped to the paths it was
# found in, so the same CVE turning up anywhere else is still reported, and
# each one expires: on that date the finding comes back to the weekly-scan
# issue, which is the reminder to check whether upstream has shipped.
#
# Remove an entry as soon as a bump picks up the fix -- an ignore that outlives
# its finding hides the next regression of it.

vulnerabilities:
  # Go standard library. fzf 0.74.5 and git-spice 0.33.0 are the latest
  # releases and were built with Go 1.27.2; the fix is in Go 1.27.3.
  - id: CVE-2026-111943
    paths:
      - usr/local/bin/fzf
      - usr/local/bin/git-spice
      - usr/local/bin/glow
    statement: Go stdlib in upstream release binaries; fixed in Go 1.27.3, which no fzf, git-spice or glow release is built with yet.
    expired_at: 2026-12-04


  # npm's own bundled dependencies, as shipped inside Node by mise. Node 24.22.x
  # (npm 11.19.1) and 26.13.0 (npm 11.20.0) both carry undici 6.28.0 and
  # brace-expansion 5.0.9. The node/* glob keeps these matching across Node
  # bumps, which change only the version directory.
  - id: CVE-2026-19534
    paths: [usr/local/share/mise/installs/node/*/lib/node_modules/npm/node_modules/undici/package.json]
    statement: undici bundled inside the npm that Node ships; fixed in npm 11.21.1, which no Node release bundles yet.
    expired_at: 2026-12-04
